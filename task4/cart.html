<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Shopping Cart</h1>
        <nav>
            <span id="cart-count">0</span>
            <a href="ecom.html">Back to Products</a>
        </nav>
    </header>
    <main>
        <div class="cart-header">
            <i class="fas fa-shopping-cart cart-icon"></i>
        </div>
        <div id="cart-items" class="cart-items-container">
            <p id="empty-cart-message">Your cart is empty.</p>
        </div>
        <div class="cart-total">
            <p>Total: $<span id="cart-total">0.00</span></p>
        </div>
        <button id="checkout-button" class="button" onclick="checkout()">Checkout</button>
        <p id="checkout-message" style="display: none;">Successfully checked out!</p>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>About Us</h3>
                <p>Your trusted online shopping destination</p>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <p>Email: support@store.com</p>
                <p>Phone: (555) 123-4567</p>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-icons">
                    <i class="fab fa-facebook"></i>
                    <i class="fab fa-twitter"></i>
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Online Store. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
